<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Kushwaha - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables for theming */
        :root {
            --primary-color: #4e73df;
            --secondary-color: #1cc88a;
            --dark-bg: #0a0e27;
            --light-bg: #f8f9fa;
            --text-dark: #333;
            --text-light: #fff;
            --accent-color: #ffc107;
            --shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            --neon-pink: #ff006e;
            --neon-cyan: #00f5ff;
            --neon-purple: #a200ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Global Styling */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(to bottom, var(--light-bg), #e9ecef);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        body.dark-mode {
            background: linear-gradient(to bottom, var(--dark-bg), #1a1f3a);
            color: var(--text-light);
        }

        /* Live Coding Wallpaper Background */
        .code-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #16213e 50%, #0f3460 100%);
            z-index: -2;
            overflow: hidden;
        }

        .code-line {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            opacity: 0.05;
            color: var(--neon-cyan);
            white-space: nowrap;
            line-height: 1.5;
            animation: float 20s infinite linear;
            pointer-events: none;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.08;
            }
            90% {
                opacity: 0.08;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Animated Grid Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(78, 115, 223, 0.05) 25%, rgba(78, 115, 223, 0.05) 26%, transparent 27%, transparent 74%, rgba(78, 115, 223, 0.05) 75%, rgba(78, 115, 223, 0.05) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(78, 115, 223, 0.05) 25%, rgba(78, 115, 223, 0.05) 26%, transparent 27%, transparent 74%, rgba(78, 115, 223, 0.05) 75%, rgba(78, 115, 223, 0.05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
            z-index: -1;
            animation: grid-move 8s linear infinite;
            pointer-events: none;
        }

        @keyframes grid-move {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 50px 50px;
            }
        }

        body.dark-mode .grid-background {
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(28, 200, 138, 0.08) 25%, rgba(28, 200, 138, 0.08) 26%, transparent 27%, transparent 74%, rgba(28, 200, 138, 0.08) 75%, rgba(28, 200, 138, 0.08) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(28, 200, 138, 0.08) 25%, rgba(28, 200, 138, 0.08) 26%, transparent 27%, transparent 74%, rgba(28, 200, 138, 0.08) 75%, rgba(28, 200, 138, 0.08) 76%, transparent 77%, transparent);
        }

        /* Floating Particles */
        .particle {
            position: fixed;
            pointer-events: none;
        }

        .particle::before {
            content: '';
            display: block;
            width: 2px;
            height: 2px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-cyan);
            animation: particle-float 15s infinite;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px) scale(0);
                opacity: 0;
            }
        }

        /* Header & Navbar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 14, 39, 0.95);
            z-index: 1000;
            padding: 15px 0;
            box-shadow: 0 0 30px rgba(78, 115, 223, 0.2);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(28, 200, 138, 0.1);
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.3s ease, text-shadow 0.3s ease;
            position: relative;
            letter-spacing: 0.5px;
        }

        nav a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.6);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            transition: width 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
        }

        .theme-toggle {
            background: none;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
        }

        .theme-toggle:hover {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.5);
            transform: rotate(20deg);
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            overflow: hidden;
            margin-top: 60px;
        }

        .hero-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            display: flex;
            transition: transform 0.8s ease;
        }

        .hero-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.3;
            flex-shrink: 0;
            filter: blur(2px) brightness(0.7);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(78, 115, 223, 0.1) 0%, rgba(28, 200, 138, 0.05) 50%, rgba(10, 14, 39, 0.8) 100%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 1s ease-in-out;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(78, 115, 223, 0.6), 0 0 60px rgba(28, 200, 138, 0.3);
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow-pulse 3s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                text-shadow: 0 0 20px rgba(0, 245, 255, 0.4), 0 0 40px rgba(78, 115, 223, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(0, 245, 255, 0.8), 0 0 60px rgba(78, 115, 223, 0.5);
            }
        }

        .hero .subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            font-weight: 300;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
            letter-spacing: 1px;
        }

        .hero .profession {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            font-weight: 600;
            margin-bottom: 30px;
            text-shadow: 0 0 15px rgba(0, 245, 255, 0.6);
            animation: float-text 3s ease-in-out infinite;
        }

        @keyframes float-text {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-button {
            padding: 15px 35px;
            border: 2px solid transparent;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.4), inset 0 0 20px rgba(0, 245, 255, 0.1);
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 40px rgba(0, 245, 255, 0.8), inset 0 0 30px rgba(0, 245, 255, 0.2);
        }

        .cta-button-secondary {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.3), inset 0 0 15px rgba(0, 245, 255, 0.05);
        }

        .cta-button-secondary:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.6), inset 0 0 30px rgba(0, 245, 255, 0.15);
        }

        .slide-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 2;
        }

        .slide-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--neon-cyan);
        }

        .slide-dot.active {
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: scale(1.5);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Sections */
        section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        section h2 {
            text-align: center;
            font-size: 2.8rem;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 50px;
            position: relative;
            font-weight: 700;
            letter-spacing: 1px;
        }

        section h2::after {
            content: '';
            width: 150px;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
        }

        body.dark-mode section {
            background: transparent;
        }

        /* About Section */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(78, 115, 223, 0.2);
            transition: all 0.3s ease;
        }

        body.dark-mode .about-content {
            background: rgba(20, 25, 50, 0.9);
            border: 1px solid rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 40px rgba(78, 115, 223, 0.1);
        }

        .about-content:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(78, 115, 223, 0.3);
        }

        .about-text h3 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .about-text p {
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 15px;
            color: #555;
        }

        body.dark-mode .about-text p {
            color: #ccc;
        }

        .about-image {
            text-align: center;
        }

        .about-image img {
            width: 100%;
            max-width: 300px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.3), 0 20px 40px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            border: 2px solid var(--neon-cyan);
        }

        .about-image img:hover {
            transform: scale(1.08) rotateZ(-2deg);
            box-shadow: 0 0 80px rgba(0, 245, 255, 0.6), 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* Skills Section */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .skill-card {
            background: linear-gradient(135deg, rgba(78, 115, 223, 0.1), rgba(28, 200, 138, 0.1));
            border: 2px solid var(--neon-cyan);
            color: #fff;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.2), transparent);
            transition: left 0.5s ease;
            z-index: 1;
        }

        .skill-card:hover::before {
            left: 100%;
        }

        .skill-card:hover {
            transform: translateY(-15px) rotateZ(-5deg);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.5), inset 0 0 30px rgba(0, 245, 255, 0.1);
            border-color: var(--neon-pink);
        }

        .skill-card i {
            font-size: 3rem;
            margin-bottom: 15px;
            display: block;
            color: var(--neon-cyan);
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .skill-card:hover i {
            color: var(--neon-pink);
            filter: drop-shadow(0 0 20px var(--neon-pink));
            transform: scale(1.2);
        }

        .skill-card h3 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
            color: var(--text-light);
        }

        .skill-card p {
            font-size: 0.9rem;
            opacity: 0.95;
            position: relative;
            z-index: 2;
        }

        /* Experience Timeline */
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, var(--neon-cyan), var(--neon-pink), var(--secondary-color));
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
        }

        .timeline-item {
            margin-bottom: 50px;
            position: relative;
        }

        .timeline-item:nth-child(even) .timeline-content {
            margin-left: 0;
            margin-right: auto;
            text-align: right;
        }

        .timeline-item:nth-child(odd) .timeline-content {
            margin-left: auto;
            margin-right: 0;
        }

        .timeline-item:nth-child(even) .timeline-dot {
            right: auto;
            left: 50%;
            transform: translateX(-50%);
        }

        .timeline-item:nth-child(odd) .timeline-dot {
            left: auto;
            right: 50%;
            transform: translateX(50%);
        }

        .timeline-dot {
            position: absolute;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            border: 3px solid var(--dark-bg);
            border-radius: 50%;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.6), inset 0 0 20px rgba(0, 245, 255, 0.2);
            z-index: 5;
            animation: pulse-dot 2s ease-in-out infinit
