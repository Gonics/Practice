<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Kushwaha - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables for theming */
        :root {
            --primary-color: #4e73df;
            --secondary-color: #1cc88a;
            --dark-bg: #0a0e27;
            --light-bg: #f8f9fa;
            --text-dark: #333;
            --text-light: #fff;
            --accent-color: #ffc107;
            --shadow: 0px 10px 30px rgba(0, 0, 0, 0.1);
            --neon-pink: #ff006e;
            --neon-cyan: #00f5ff;
            --neon-purple: #a200ff;
            --neon-green: #39ff14;
            --neon-blue: #0080ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Global Styling */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(to bottom, var(--light-bg), #e9ecef);
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            position: relative;
        }

        body.dark-mode {
            background: linear-gradient(to bottom, var(--dark-bg), #1a1f3a);
            color: var(--text-light);
        }

        /* ============= BINARY CODE LIVE WALLPAPER ============= */
        .binary-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #0f1b3d 25%, #1a1147 50%, #0f1b3d 75%, #0a0e27 100%);
            z-index: -2;
            overflow: hidden;
        }

        .binary-stream {
            position: absolute;
            font-family: 'Courier Prime', monospace;
            font-weight: 700;
            font-size: 14px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            opacity: 0;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 20px rgba(57, 255, 20, 0.3);
            white-space: pre;
            line-height: 1.2;
            animation: binaryFall 15s linear infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 5px var(--neon-green));
        }

        @keyframes binaryFall {
            0% {
                transform: translateY(-100vh) scaleY(1);
                opacity: 0;
            }
            5% {
                opacity: 0.6;
            }
            95% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(100vh) scaleY(1);
                opacity: 0;
            }
        }

        /* Animated Grid Background */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, rgba(0, 245, 255, 0.03) 25%, rgba(0, 245, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 245, 255, 0.03) 75%, rgba(0, 245, 255, 0.03) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(0, 245, 255, 0.03) 25%, rgba(0, 245, 255, 0.03) 26%, transparent 27%, transparent 74%, rgba(0, 245, 255, 0.03) 75%, rgba(0, 245, 255, 0.03) 76%, transparent 77%, transparent);
            background-size: 80px 80px;
            z-index: -1;
            animation: grid-move 20s linear infinite;
            pointer-events: none;
        }

        @keyframes grid-move {
            0% {
                background-position: 0 0;
            }
            100% {
                background-position: 80px 80px;
            }
        }

        /* Floating Particles with Glow */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: -1;
        }

        .particle::before {
            content: '';
            display: block;
            width: 3px;
            height: 3px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px rgba(0, 245, 255, 0.5);
            animation: particle-float 20s infinite;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(150px) scale(0);
                opacity: 0;
            }
        }

        /* Hexagon Grid Background Elements */
        .hex-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .hex {
            position: absolute;
            opacity: 0.05;
            border: 2px solid var(--neon-cyan);
        }

        /* ============= HEADER & NAVBAR ============= */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: linear-gradient(180deg, rgba(10, 14, 39, 0.98), rgba(10, 14, 39, 0.7));
            z-index: 1000;
            padding: 15px 0;
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.15), inset 0 -1px 0 rgba(0, 245, 255, 0.1);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid;
            border-image: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink)) 1;
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            letter-spacing: 1.5px;
        }

        nav a::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.6);
        }

        nav a:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        nav a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 20px rgba(0, 245, 255, 0.8), 0 0 40px rgba(0, 245, 255, 0.4);
            transform: translateY(-3px);
        }

        .theme-toggle {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.1), rgba(255, 0, 110, 0.1));
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 10px 14px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3), inset 0 0 20px rgba(0, 245, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .theme-toggle::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple), var(--neon-cyan));
            background-size: 300% 300%;
            border-radius: 12px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: none;
        }

        .theme-toggle:hover::before {
            opacity: 0.5;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .theme-toggle:hover {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.6), inset 0 0 30px rgba(255, 0, 110, 0.1);
            transform: rotate(30deg) scale(1.1);
        }

        /* ============= HERO SECTION ============= */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            overflow: hidden;
            margin-top: 60px;
        }

        .hero-slider {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            display: flex;
            transition: transform 0.8s ease;
        }

        .hero-slider img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            flex-shrink: 0;
            filter: blur(3px) brightness(0.5) contrast(1.2);
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 245, 255, 0.08) 0%, rgba(78, 115, 223, 0.12) 30%, rgba(10, 14, 39, 0.95) 100%);
            z-index: 1;
            animation: heroGlow 4s ease-in-out infinite;
        }

        @keyframes heroGlow {
            0%, 100% {
                background: radial-gradient(circle at 50% 50%, rgba(0, 245, 255, 0.08) 0%, rgba(78, 115, 223, 0.12) 30%, rgba(10, 14, 39, 0.95) 100%);
            }
            50% {
                background: radial-gradient(circle at 50% 50%, rgba(0, 245, 255, 0.15) 0%, rgba(78, 115, 223, 0.2) 30%, rgba(10, 14, 39, 0.95) 100%);
            }
        }

        .hero-content {
            position: relative;
            z-index: 2;
            animation: fadeInUp 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hero h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 3px;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 4s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0, 245, 255, 0.4));
        }

        @keyframes titleGlow {
            0%, 100% {
                filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.3)) drop-shadow(0 0 40px rgba(255, 0, 110, 0.1));
            }
            50% {
                filter: drop-shadow(0 0 40px rgba(0, 245, 255, 0.6)) drop-shadow(0 0 60px rgba(255, 0, 110, 0.3));
            }
        }

        .hero .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.8rem);
            font-weight: 300;
            margin-bottom: 35px;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.5), 0 0 60px rgba(0, 245, 255, 0.2);
            animation: floatUp 3s ease-in-out infinite;
        }

        @keyframes floatUp {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .hero .profession {
            font-size: 1.4rem;
            color: var(--neon-green);
            font-weight: 700;
            margin-bottom: 35px;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.7), 0 0 40px rgba(57, 255, 20, 0.3);
            letter-spacing: 2px;
            animation: pulse-text 2.5s ease-in-out infinite;
        }

        @keyframes pulse-text {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 20px rgba(57, 255, 20, 0.7), 0 0 40px rgba(57, 255, 20, 0.3);
            }
            50% {
                transform: scale(1.05);
                text-shadow: 0 0 30px rgba(57, 255, 20, 1), 0 0 60px rgba(57, 255, 20, 0.5);
            }
        }

        .hero-buttons {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        .cta-button {
            padding: 18px 45px;
            border: 2px solid transparent;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            color: #000;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            display: inline-block;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.4), 0 0 60px rgba(255, 0, 110, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.2);
            text-transform: uppercase;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.6s ease;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            transform: translateY(-8px) scale(1.08);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.8), 0 0 100px rgba(255, 0, 110, 0.5), inset 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .cta-button:active {
            transform: translateY(-3px) scale(0.98);
        }

        .cta-button-secondary {
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.3), inset 0 0 15px rgba(0, 245, 255, 0.05);
        }

        .cta-button-secondary:hover {
            background: rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.7), inset 0 0 30px rgba(0, 245, 255, 0.2);
            color: #fff;
        }

        .slide-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 3;
        }

        .slide-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(0, 245, 255, 0.3);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 245, 255, 0.2);
        }

        .slide-dot.active {
            background: var(--neon-cyan);
            box-shadow: 0 0 25px var(--neon-cyan), 0 0 50px rgba(0, 245, 255, 0.5);
            transform: scale(1.8);
        }

        .slide-dot:hover {
            transform: scale(1.5);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.6);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============= SECTIONS ============= */
        section {
            padding: 100px 20px;
            max-width: 1300px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        section h2 {
            text-align: center;
            font-size: 3.2rem;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 70px;
            position: relative;
            font-weight: 800;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.2));
        }

        section h2::after {
            content: '';
            width: 200px;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.6), 0 0 60px rgba(255, 0, 110, 0.3);
        }

        /* ============= ABOUT SECTION ============= */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.97), rgba(240, 245, 255, 0.95));
            padding: 60px;
            border-radius: 25px;
            box-shadow: 0 25px 80px rgba(78, 115, 223, 0.25), 0 0 60px rgba(0, 245, 255, 0.1);
            border: 2px solid rgba(0, 245, 255, 0.2);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .about-content::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 245, 255, 0.1) 0%, transparent 70%);
            animation: floatElement 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes floatElement {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, 50px); }
        }

        body.dark-mode .about-content {
            background: linear-gradient(135deg, rgba(20, 25, 50, 0.95), rgba(15, 20, 45, 0.95));
            border: 2px solid rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 80px rgba(78, 115, 223, 0.2), 0 0 40px rgba(0, 245, 255, 0.1);
        }

        .about-content:hover {
            transform: translateY(-15px);
            box-shadow: 0 40px 120px rgba(78, 115, 223, 0.35), 0 0 80px rgba(0, 245, 255, 0.2);
        }

        .about-text h3 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .about-text p {
            font-size: 1.15rem;
            line-height: 1.9;
            margin-bottom: 20px;
